name: Driver bug report
description: Report a crash, visual bug or driver load failure with the Turnip A22 package
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Driver bugs are hard to fix without the device and
        log details below — please fill in every relevant field.

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. Retroid Pocket G2 (Moorechip)
    validations:
      required: true

  - type: input
    id: soc
    attributes:
      label: SoC / GPU string
      description: From `adb shell getprop ro.soc.model` and the driver info
      placeholder: e.g. SG6275P / Adreno (TM) 22
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: Driver package
      options:
        - Release package
        - Custom build
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: The `driverVersion` / package name shown by the front-end, or the zip name
      placeholder: e.g. 26.3.0 (turnip-a22-26.3.0.adpkg.zip)
    validations:
      required: true

  - type: input
    id: frontend
    attributes:
      label: Front-end and title
      placeholder: e.g. Eden nightly + Zelda TotK, Winlator 10 + Fallout 4
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: What happens
      description: Crash at startup? Black screen? Artifacts? Note whether it works with the stock driver and with a stock Turnip build.
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logcat / crash buffer
      description: Output of `adb logcat -b crash -d` and `adb logcat -d | grep -iE "turnip|adreno|vulkan|adrenotools"`
      render: shell
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: Environment variables
      description: Any TU_DEBUG / TU_AUTOTUNE_* / FD_DEV_FEATURES set for this run
      placeholder: e.g. TU_AUTOTUNE_ALGO=prefer_gmem
    validations:
      required: false
