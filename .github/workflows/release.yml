name: release

# Manual publishing. Run from the Actions tab (or `gh workflow run release.yml
# -f tag=v26.3.0-a22.2`) after the tag exists and the packages have been
# validated on hardware with the device-test workflow. Tag pushes do not
# auto-publish, so hardware-validated artifacts can be the ones users get.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v26.3.0-a22.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex python3 python3-pip python3-venv \
            zip unzip curl xz-utils git pkg-config
          python3 -m pip install --break-system-packages meson ninja pyyaml packaging mako

      - name: Cache Android NDK r28c
        uses: actions/cache@v4
        with:
          path: src/android-ndk-r28c
          key: ndk-r28c-linux

      - name: Build both variants
        run: |
          chmod +x scripts/build_turnip_g2gen2.sh
          ./scripts/build_turnip_g2gen2.sh

      - name: Write combined checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign checksums (optional)
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          sudo apt-get install -y --no-install-recommends minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -Sm dist/SHA256SUMS.txt -s "$RUNNER_TEMP/minisign.key" \
            -t "Turnip A22 ${{ inputs.tag }}"
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; cut a new tag instead of republishing."
            exit 1
          fi
          assets=(dist/*.zip dist/SHA256SUMS.txt)
          if [ -f dist/SHA256SUMS.txt.minisig ]; then
            assets+=(dist/SHA256SUMS.txt.minisig)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --title "Turnip A22 $TAG" \
            --generate-notes
